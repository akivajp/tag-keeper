<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tag-keeper</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">tag-keeper</a>
    <nav>
      <a href="#/" data-nav="roots">ルート</a>
      <a href="#/browse" data-nav="browse">ファイル</a>
      <a href="#/organize" data-nav="organize">整理</a>
      <a href="#/tags" data-nav="tags">タグ</a>
      <a href="#/plans" data-nav="plans">プラン</a>
    </nav>
  </header>
  <!-- 同期を止めたままのプランなど、どの画面でも見せる警告 -->
  <div id="alerts"></div>
  <main id="main"><p class="muted">読み込み中…</p></main>
  <!-- 動いている処理の進み具合（画面の下に固定） -->
  <section id="job" class="job" hidden></section>
  <dialog id="confirm">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <div id="confirm-body"></div>
      <div class="actions">
        <button value="cancel" class="secondary">やめる</button>
        <button value="ok" id="confirm-ok" class="primary">実行する</button>
      </div>
    </form>
  </dialog>
  <script src="/static/app.js"></script>
  <script src="/static/pages.js"></script>
</body>
</html>
